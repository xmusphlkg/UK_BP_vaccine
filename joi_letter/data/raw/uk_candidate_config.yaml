    protection to infants whose mothers were not vaccinated. The maternal 0.50 VE
    against hospitalization given symptomatic disease is a structural cascade mapping,
    not a directly estimated conditional effect: with maternal_relative_effect=0.75,
    maternal_VE_sus=0.55, and maternal_VE_sym=0.92, it gives approximately 91% overall
    effectiveness against hospitalization [1-(1-0.75*0.55)(1-0.75*0.92)(1-0.50)].
    Other origin-specific conditional effects are structural severity assumptions
    rather than direct estimates at every dose/waning state.

    '
resistance:
  target_prevalence_at_analysis_start: 0.003
  importation_fraction: 0.003
  prevalence_mode: dynamic
  prevalence_mode_note: '``dynamic`` evolves sensitive and resistant strains from
    their initial composition. ``exogenous_fixed`` is a separately declared structural
    proxy that fixes incident strain composition to an external prevalence input when
    strain surveillance is insufficient to identify evolution.

    '
  rebalance_after_burn_in: true
  prevalence_anchor_rate_per_year: 2.0
  anchor_during_dynamics: false
  initial_resistance_prevalence_deprecated: true
  use_country_resistance_timeline: true
  country_timeline:
    country: United_Kingdom
    iso3: GBR
    resistance_anchor_year: 2025
    resistant_fraction: 0.003
    lower: 0.0
    upper: 0.011
    method: nearest_past_year
    evidence_years: '2024'
    evidence_type: measured_national_surveillance_fraction
    source: https://www.postersessiononline.eu/173580348_eu/congresos/UKHSA2025/aula/-P_58_UKHSA2025.pdf
    notes: 'UKHSA national reference laboratory poster: 661 B. pertussis isolates
      received from June 2023 to November 2024, with 2 predicted and phenotypically
      confirmed macrolide-resistant isolates.'
stochastic_resistance:
  enabled: false
  effective_population_size: 2000
  min_strain_fraction: 0.001
  random_seed: 20260515
  note: 'Experimental tau-leaping stochastic layer for resistance strain dynamics.
    It is disabled for the submitted deterministic analyses. The effective_population_size
    controls the magnitude of genetic drift: smaller values produce more stochastic
    fluctuation and slower fixation. A value of 2000 represents the effective number
    of independent transmission events determining strain composition per output time
    step, accounting for household clustering (SAR~0.8) that reduces the effective
    number of independent events well below the total infectious population. This
    addresses the known limitation that deterministic ODE models produce unrealistically
    fast resistance fixation (model: 2-3 years vs observed: 6-8 years in China) by
    introducing the genetic drift that naturally slows selection in finite populations.

    '
