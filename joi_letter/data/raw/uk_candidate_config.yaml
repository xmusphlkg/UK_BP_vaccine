fitness_grid:
  random_seed: 20260510
  fitness_R_values:
  - 0.7
  - 0.8
  - 0.85
  - 0.9
  - 0.95
  - 0.98
  - 1.0
  - 1.02
  - 1.05
  - 1.1
  - 1.15
  - 1.2
  - 1.25
  VE_inf_values:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  description: 'Continuous macrolide-resistant strain fitness stress test crossed
    with plausible-to-upper-bound vaccine infectiousness effects. VE_inf is the reduction
    in onward infectiousness among infected vaccine-history origins, not protection
    against infection. The fitness grid now includes finer resolution around fitness_R
    = 1.0 (neutral) because epidemiological evidence from China (36% to >99% MRBP
    in 8 years), Japan (83-88% in 2024-2025), and international MT28 spread suggests
    the true fitness is near or above 1.0. Values below 0.85 are retained for completeness
    but are increasingly inconsistent with observed resistance dynamics. VE_inf axis
    expanded from 5 to 11 uniform steps (0.05 increments) to improve heatmap resolution
    in Figure 3E/F panels.

    '
bayesian_uncertainty:
  random_seed: 20260510
  publication_country_exclusions:
    United_States: "The former m1 current-week series is not a final notification\
      \ series. Only three final annual observations (2021\u20132023) have an unambiguous\
      \ validated reporting-year scope. Retain these as source context only; exclude\
      \ the profile from formal calibration and programme comparison.\n"
    South_Africa: 'Only three recent non-overlapping observation intervals are available,
      below the prespecified five-interval calibration/validation floor. Retain as
      an exploratory deterministic scenario, but exclude it from calibrated policy
      uncertainty until additional surveillance data or a separately justified external
      calibration model is supplied.

      '
  inference_structure: cross_country_joint_state_space_tempered_smc
  shared_structural_seed: 20260712
  n_chains: 4
  warmup: 0
  draws: 1024
  thin: 1
  proposal_scale: 1.0
  smc_particles: 1024
  smc_islands: 4
  smc_ess_fraction: 0.7
  smc_move_steps: 4
  smc_global_covariance_fraction: 0.25
  smc_guided_state_covariance_scale: 4.0
  smc_guided_bridge_temperature_scale: 0.0001
  smc_shared_population_guide_switch_temperature: 0.001
  smc_max_stages: 100
  smc_final_move_rounds: 4
  posterior_predictive_draws_per_country: 100
  dispersion: 50.0
  enable_time_varying_reporting: false
  likelihood_observation_frequency: annual
  require_calibrated_start: true
  state_space_importance:
    adaptation_candidate_count: 512
    adaptation_round_candidate_count: 512
    candidate_count: 1024
    max_adaptive_rounds: 2
    require_recommended_quality: true
    localized_mixture_enabled: true
    localized_candidate_count: 2048
    localized_component_count: 8
    localized_covariance_scale: 0.25
    adaptation_target_ess: 96
    adaptation_covariance_regularization: 0.1
    initial_proposal_covariance_scales:
    - 0.0625
    - 0.25
    - 1.0
    - 4.0
    proposal_covariance_scales:
    - 0.25
    - 0.5
    - 1.0
    - 2.0
    - 4.0
    note: 'Legacy rejected route. Multi-scale exact-target importance tests showed
      severe local and global weight collapse and cannot generate the publication
      95% credible interval. These controls are not consumed by run_hierarchical_joint_smc.

      '
  figure2c_parametric_bootstrap_confidence_interval:
    replicates_per_country: 1024
    minimum_successful_replicates: 1000
    minimum_success_fraction: 0.95
    maximum_tail_probability_mcse: 0.005
    stability_blocks: 8
    parallel_workers: 100
    checkpoint_chunk_size: 100
    retry_maxiter_schedule:
    - 64
    - 128
    seed: 20260716
    note: 'Canonical Figure 2c uncertainty route. Each replicate regenerates a complete
      annual latent transmission path from the prespecified bounded AR(1) process
      and native reporting-interval surveillance counts from the fitted NB2 model,
      fully refits the country state-space MAP model, and propagates that same refit
      through current practice and every intervention strategy. The 2.5% and 97.5%
      percentile endpoints are paired parametric-bootstrap 95% confidence intervals
      for the fitted scenario-reduction estimand. They are neither posterior credible
      intervals nor future-observation prediction intervals. Biological quantities,
      intervention definitions, AR(1) hyperparameters remain fixed at prespecified
      reference values; the reference-exposure NB2 dispersion is refitted in each
      replicate.

      '
  figure1b_current_practice_conditional_parametric_bootstrap_confidence_interval:
    replicates_per_country: 1024
    minimum_successful_replicates: 1000
    minimum_success_fraction: 0.95
    maximum_tail_probability_mcse: 0.005
    stability_blocks: 8
    parallel_workers: 48
    checkpoint_chunk_size: 50
    retry_maxiter_schedule:
    - 64
    - 128
    seed: 20260718
    note: 'Figure 1b current-practice-only conditional uncertainty route. Each replicate
      holds the accepted fitted annual latent transmission path as the generating
      trajectory, regenerates grouped NB2 surveillance counts, fully refits the country
      state-space MAP model, and runs current practice once. The reported-case, symptomatic-case,
      and infection indices are retained from the same fitted replicate. Percentile
      endpoints are conditional parametric-bootstrap confidence intervals, not posterior
      credible intervals or future-observation prediction intervals. Biological quantities
      and AR(1) hyperparameters remain fixed at prespecified reference values; the
      reference-exposure NB2 dispersion is refitted in each replicate.

      '
  figure2c_joint_credible_interval:
    posterior_draws_per_country: 4096
    note: 'Retired checkpoint-compatible route, retained only for provenance. Figure
      2c previously used paired draws from the multi-country full-feedback joint posterior.
      Shared biological parameters, country beta/reporting, and annual latent transmission
      states are jointly weighted by the exact NB2 plus AR(1) plus mechanistic ODE
      target. Intervention implementation and effect quantities have prespecified
      priors and no direct likelihood, so their posterior equals their prior; the
      same complete draw is propagated through current practice and each intervention.
      The plotted 2.5% and 97.5% quantiles are joint-posterior 95% credible intervals.

      '
    intervention_priors:
      adolescent_coverage_floor:
        low: 0.75
        mode: 0.9
        high: 0.98
        distribution: triangular
        note: Plausible achieved adolescent Tdap coverage floor under scale-up.
      maternal_coverage_floor:
        low: 0.55
        mode: 0.75
        high: 0.9
        distribution: triangular
        note: Plausible achieved pregnancy Tdap coverage floor under scale-up.
      young_adult_coverage_floor:
        low: 0.35
        mode: 0.55
        high: 0.75
        distribution: triangular
        note: Plausible achieved close-contact/reproductive-age adult Tdap coverage
          floor.
      contact_reduction_fraction:
        low: 0.05
        mode: 0.15
        high: 0.3
        distribution: triangular
        note: Directional reduction in young-adult to infant effective contacts for
          adjunct exposure reduction.
      targeted_pep_coverage:
        low: 0.05
        mode: 0.45
        high: 0.6
        distribution: triangular
        note: Plausible household-contact PEP reach among guideline-prioritized contacts.
      maternal_protection_duration_days:
        low: 90.0
        mode: 180.0
        high: 270.0
        distribution: triangular
        note: Duration of passive maternal protection in early infancy.
  note: 'The canonical route is multi-country adaptive tempered SMC over the full
    joint state: seven shared biological parameters plus country-specific beta, reporting,
    and annual AR(1) transmission paths. Tempering proceeds from the normalized joint
    prior to the exact NB2/ODE target, with island-wise resampling and exact-target
    shared/state rejuvenation moves. The former conditional cut and nested importance
    routes are retained only as rejected sensitivity implementations and are not publication
    inputs.

    '
  convergence_criteria:
    rhat_threshold: 1.05
    min_bulk_ess: 100
    min_tail_ess: 50
    recommended_rhat_threshold: 1.01
    recommended_min_bulk_ess: 400
    recommended_min_tail_ess: 400
    note: 'SMC islands are independent diagnostic chains. Publication acceptance requires
      final temperature 1, stage-wise island ESS control, active rejuvenation, adequate
      particle and island diversity, rank-normalized cross-island R-hat/bulk/tail
      ESS, complete annual process paths, cross-country shared-draw pairing, and rolling-origin
      predictive checks.

      '
  adaptive_metropolis:
    adaptation_start: 50
    mixing_fraction: 0.95
    epsilon: 1.0e-06
    note: 'Adaptive Metropolis (Haario et al. 2001) learns the empirical covariance
      from chain history during warmup. After adaptation_start steps, the proposal
      is 95% adapted covariance + 5% initial diagonal for ergodicity. The adapted
      covariance captures correlations such as the strong negative correlation between
      beta_S and reporting_multiplier.

      '
  priors:
    log_beta_S_sd: 1.25
    log_reporting_multiplier_sd: 0.35
    VE_sus:
      mean: 0.15
      sd: 0.1
      note: 'Weak vaccine-mechanism prior for reduced susceptibility, centred on the
        selected symptom-protective baseline. Aggregate studies do not identify this
        acquisition component separately; see parameter_distributions.yaml for support
        and provenance.

        '
    VE_inf:
      mean: 0.25
      sd: 0.15
      note: 'Broad vaccine-mechanism prior for reduced onward infectiousness among
        vaccinated infections. Human data support residual transmission but do not
        identify this component separately.

        '
    VE_dur:
      mean: 0.1
      sd: 0.1
      note: 'Mechanistic duration-shortening proxy for reduced infectious duration
        among vaccinated infections. It is sampled jointly in the shared external-prior
        structural design for Figure 2c and remains a vaccine-mechanism sensitivity
        parameter in deterministic diagnostics.

        '
    relative_infectiousness_asymptomatic:
      mean: 0.5
      sd: 0.25
      note: 'Relative infectiousness of asymptomatic/subclinical infections compared
        to symptomatic cases. The exact ratio is not identified; the central registry
        assigns a broad weak-model prior.

        '
    infectious_duration_symptomatic:
      log_sd: 0.103
      note: 'Compatibility width only. The normalized Bayesian prior is centred at
        the literature model-fit median of 24 days and truncated to [14, 35] days
        in parameter_distributions.yaml.

        '
    infectious_duration_asymptomatic:
      log_sd: 0.3
      note: 'Weak modelling assumption; the central registry uses median 17.3 days
        and support [7, 28] because human data do not identify it.

        '
    fitness_R:
      min: 0.7
      max: 1.25
      mean: 1.0
      sd: 0.15
      note: 'Compatibility width alias. Production uses the central truncated lognormal
        weak-model prior (median 1.0, log-SD 0.15, support [0.70, 1.25]).

        '
    resistance_prevalence:
      floor_sd: 0.03
      note: 'Resistance prevalence is FIXED at the country-calibrated value during
        MCMC (not sampled). The country_resistance_timeline.csv provides well-constrained
        estimates for most countries. This eliminates a major source of multimodality
        without losing scientific information.

        '
    maternal_VE_sus:
      mean: 0.55
      sd: 0.12
      note: 'Prior for maternal antibody protection against infant infection. Centered
        on 0.55 using maternal Tdap effectiveness evidence for confirmed pertussis
        in infants younger than 2 months [36], which combines infection prevention
        and disease prevention. The infection-blocking component is a decomposed model
        assumption guided by maternal immunization effectiveness studies [10,12].
        SD of 0.12 allows exploration of [0.30, 0.80].

        '
    maternal_VE_sym:
      mean: 0.92
      sd: 0.05
      note: 'Prior for maternal antibody protection against symptomatic disease given
        infection. High confidence based on consistent estimates of VE against hospitalization
        (>90%) across US, UK, and Argentina studies [10,36,37]. Narrow SD reflects
        strong evidence consensus.

        '
  stochastic_overlay:
    enabled: true
    random_seed: 20260511
    replicates_per_draw: 200
    superspreading_k: 10.0
    superspreading_k_min: 1.0
    household_mean_size: 3.5
    household_secondary_attack_rate: 0.8
    min_expected_count: 1.0
