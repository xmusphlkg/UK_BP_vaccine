observation_model:
  enabled: true
  structure: symptomatic_to_care_to_test_to_report
  case_event_definition: symptomatic_onset
  diagnostic_standards:
    enabled: true
    multiplier_column: relative_detection_prior_mean
    note: 'Applies a literature-coded, country-specific diagnostic/reporting-regime
      multiplier from data/raw/pertussis_diagnostic_standards_timeline.csv to reported-case
      outputs. This is an observation-layer adjustment only; it does not alter infection
      dynamics.

      '
    periods_loaded: 3
  note: 'Runtime reported cases use the age-specific final reporting probabilities
    in age_groups/reporting_rate, with calibration allowed to multiply those probabilities.
    The explicit care/test/report split is retained as the intended observation contract
    for country calibration. IMPORTANT: reporting_rate and reporting_multiplier affect
    ONLY the observation layer (how many true cases appear in surveillance). Treatment
    rates in the ODE are scaled by diagnosis_probability, which defaults to the baseline
    reporting_rate but is NOT modified by reporting_multiplier or reporting-rate sensitivity
    scenarios. This decoupling ensures that reporting-rate sensitivity analyses do
    not inadvertently alter resistance selection pressure through the treatment pathway.

    '
