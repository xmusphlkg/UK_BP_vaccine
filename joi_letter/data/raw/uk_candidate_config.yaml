    description: Baseline reporting rates as configured in country profiles.
  high:
    multiplier: 1.5
    description: Uniformly higher reporting (50% increase across all ages).
  low:
    multiplier: 0.5
    description: Uniformly lower reporting (50% decrease across all ages).
  age_biased:
    age_multipliers:
      infant_0_2m: 1.2
      infant_3_11m: 1.1
      child_1_4y: 0.9
      child_5_9y: 0.8
      adolescent_10_17y: 0.7
      young_adult_18_39y: 0.6
      middle_adult_40_64y: 0.5
      elderly_65plus: 0.6
    description: 'Age-biased reporting where infant ascertainment is slightly higher
      and adult/adolescent ascertainment is lower than baseline.

      '
  time_varying:
    multiplier: 1.0
    time_variation:
      start_multiplier: 0.5
      end_multiplier: 1.5
    description: 'Linearly improving reporting over the analysis period (e.g. due
      to increased awareness, better diagnostics, or expanded testing).

      '
  infant_high_adult_very_low:
    age_multipliers:
      infant_0_2m: 1.0
      infant_3_11m: 0.9
      child_1_4y: 0.6
      child_5_9y: 0.5
      adolescent_10_17y: 0.3
      young_adult_18_39y: 0.2
      middle_adult_40_64y: 0.15
      elderly_65plus: 0.2
    description: 'Strong age gradient: infant reporting near baseline but adolescent
      and adult reporting reduced to 3-5% absolute (consistent with Ontario capture-recapture:
      11% of age 1+ cases reported, and England/Wales notification efficiency of 5-25%
      overall). This scenario tests whether the true infection burden in adults is
      substantially higher than reported cases suggest.

      '
  infant_moderate_adult_minimal:
    age_multipliers:
      infant_0_2m: 0.7
      infant_3_11m: 0.6
      child_1_4y: 0.5
      child_5_9y: 0.4
      adolescent_10_17y: 0.2
      young_adult_18_39y: 0.1
      middle_adult_40_64y: 0.08
      elderly_65plus: 0.1
    description: 'Extreme under-reporting scenario anchored to the lower end of literature
      estimates. Infant reporting at 35-42% (Ontario hospital study: 37%), school-age
      at 2-5%, adults at 0.5-2.5%. Represents passive surveillance systems without
      active case-finding.

      '
  enhanced_surveillance:
    age_multipliers:
      infant_0_2m: 1.3
      infant_3_11m: 1.2
      child_1_4y: 1.4
      child_5_9y: 1.5
      adolescent_10_17y: 1.8
      young_adult_18_39y: 2.5
      middle_adult_40_64y: 2.5
      elderly_65plus: 2.0
    description: 'Enhanced surveillance scenario where improved diagnostics (PCR availability,
      point-of-care testing) increase ascertainment, particularly in older age groups.
      Represents the effect of active surveillance programs or outbreak investigations.

      '
  adult_focused_improvement:
    age_multipliers:
      infant_0_2m: 1.0
      infant_3_11m: 1.0
      child_1_4y: 1.0
      child_5_9y: 1.0
      adolescent_10_17y: 2.0
      young_adult_18_39y: 3.0
      middle_adult_40_64y: 3.0
      elderly_65plus: 2.5
    description: 'Scenario where adult/adolescent reporting improves substantially
      (e.g. through Tdap booster awareness campaigns, expanded testing guidelines
      for prolonged cough). Tests sensitivity of total burden estimates to adult ascertainment
      improvements.

      '
  china_passive_system:
    age_multipliers:
      infant_0_2m: 0.8
      infant_3_11m: 0.7
      child_1_4y: 0.5
      child_5_9y: 0.4
      adolescent_10_17y: 0.25
      young_adult_18_39y: 0.15
      middle_adult_40_64y: 0.12
      elderly_65plus: 0.15
    description: 'Calibrated to Yiwu active-surveillance study (China) which found
      community incidence of 108.3/100k vs passive surveillance estimates far below
      this. Represents the gap between active and passive surveillance in a middle-income
      setting.

      '
