    the half-open solver boundary immediately after the inclusive analysis_end_date.
    Output rows include calendar_date/calendar_year. Calibration overrides these dates
    to the observed surveillance window so modelled and observed annual cases align
    by real calendar year, with reporting intervals split across calendar-year boundaries.
